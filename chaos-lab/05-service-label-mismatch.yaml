# Lab 5: Service Not Routing — Label mismatch between Service selector and Pod labels
---
# The Pod has label: app=my-web-app
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svc-mismatch-app
  namespace: chaos-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-web-app
      chaos: svc-mismatch
  template:
    metadata:
      labels:
        app: my-web-app
        chaos: svc-mismatch
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
---
# BUG: Service selector looks for app=web-application (WRONG label)
apiVersion: v1
kind: Service
metadata:
  name: chaos-svc-broken
  namespace: chaos-lab
spec:
  selector:
    # BUG: This label doesn't match the pod's label (my-web-app vs web-application)
    app: web-application
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
