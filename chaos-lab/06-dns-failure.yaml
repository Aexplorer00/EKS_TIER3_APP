# Lab 6: DNS Resolution Failure — Pod with wrong DNS policy
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-test-pod
  namespace: chaos-lab
  labels:
    chaos: dns-fail
spec:
  containers:
  - name: debug
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  # BUG: dnsPolicy "None" with no dnsConfig means no DNS resolution at all
  dnsPolicy: None
  dnsConfig:
    nameservers:
    # BUG: Pointing to a fake DNS server that doesn't exist
    - 192.168.255.255
