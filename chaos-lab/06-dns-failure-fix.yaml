# Lab 6 FIX: Use ClusterFirst DNS policy (the default)
---
apiVersion: v1
kind: Pod
metadata:
  name: dns-test-pod-fixed
  namespace: chaos-lab
  labels:
    chaos: dns-fixed
spec:
  containers:
  - name: debug
    image: busybox:1.36
    command: ["sleep", "3600"]
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  # FIX: ClusterFirst uses CoreDNS for cluster service names
  # then falls back to upstream DNS for external names
  dnsPolicy: ClusterFirst
