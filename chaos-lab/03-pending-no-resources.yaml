# Lab 3: Pending — Requesting more resources than any node has
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pending-huge-resources
  namespace: chaos-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      chaos: pending-resources
  template:
    metadata:
      labels:
        chaos: pending-resources
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          # BUG: Requesting 64 CPUs and 128Gi RAM — no node has this much
          requests:
            cpu: "64"
            memory: 128Gi
          limits:
            cpu: "64"
            memory: 128Gi
