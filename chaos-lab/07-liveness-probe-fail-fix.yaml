# Lab 7 FIX: Correct the liveness probe path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: liveness-fail
  namespace: chaos-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      chaos: liveness
  template:
    metadata:
      labels:
        chaos: liveness
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        # FIX: Liveness probe now checks / which nginx serves (200 OK)
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
